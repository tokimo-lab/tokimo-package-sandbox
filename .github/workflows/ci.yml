name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ------------------------------------------------------------------
  # Linux: build + lib/bins tests. Integration tests are skipped in CI;
  # they require the packaged vm/rootfs (Node 24, Python 3, …) which is
  # produced by .github/workflows/vm.yml under tag prefix vm-* and is
  # not bundled in the repo. Run them locally after fetch-vm.sh.
  # ------------------------------------------------------------------
  linux:
    name: linux (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap

      - name: Build
        run: cargo build --lib --bins --tests --examples

      - name: Test (lib + bins)
        run: cargo test --lib --bins

  # ------------------------------------------------------------------
  # Linux integration: bwrap backend.
  # Pulls the vm-kernel-* + vm-rootfs-* release tarballs (Debian generic
  # bzImage + initrd + rootfs) and runs the full integration suite with
  # SANDBOX_BACKEND=bwrap. No KVM needed.
  # ------------------------------------------------------------------
  linux-bwrap-integration:
    name: linux integration (bwrap)
    runs-on: ubuntu-latest
    needs: linux
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install runtime deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap curl jq zstd tar

      - name: Relax AppArmor unprivileged-userns restriction
        # Ubuntu 24.04 ships with an AppArmor profile that strips
        # capabilities (notably CAP_NET_ADMIN) from unprivileged user
        # namespaces. Bubblewrap relies on CAP_NET_ADMIN inside the new
        # netns to bring up `lo`; without this knob it fails with
        # "bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted"
        # and every test that needs `start_vm()` panics with an
        # ECONNRESET on the init handshake.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0 || true

      - name: Fetch VM artifacts (vmlinuz + initrd + rootfs)
        run: scripts/linux/fetch-vm.sh -k vm-kernel-0.2.1 -r vm-rootfs-0.2.1

      - name: Build guest binaries needed by bwrap (init/fuse/tun-pump/host-exec)
        run: cargo build --bin tokimo-sandbox-init --bin tokimo-sandbox-fuse --bin tokimo-tun-pump --bin tokimo-host-exec

      - name: Stage host binaries into .vm/base/host-bin/ (bwrap backend)
        run: |
          mkdir -p .vm/base/host-bin
          cp target/debug/tokimo-sandbox-init \
             target/debug/tokimo-sandbox-fuse \
             target/debug/tokimo-host-exec \
             .vm/base/host-bin/
          chmod +x .vm/base/host-bin/*
          ls -la .vm/base/host-bin/

      - name: Disk usage before tests
        run: df -h /

      - name: Integration tests (bwrap)
        env:
          SANDBOX_BACKEND: bwrap
        run: |
          export PATH="$PWD/target/debug:$PATH"
          cargo test --tests --no-fail-fast -- --test-threads=1

      - name: Disk usage after tests
        if: always()
        run: df -h / && du -sh .vm 2>/dev/null || true

  # ------------------------------------------------------------------
  # Linux integration: ch (cloud-hypervisor) backend.
  # Same artifacts as bwrap (the Debian vmlinuz boots ch v36+ as bzImage
  # and the initrd loads vmw_vsock_virtio_transport early). Additionally
  # fetches the cloud-hypervisor + virtiofsd static binaries into bin/.
  # Requires nested KVM — ubuntu-latest hosted runners have /dev/kvm
  # since runner-images 2023.09.
  # ------------------------------------------------------------------
  linux-ch-integration:
    name: linux integration (ch)
    runs-on: ubuntu-latest
    needs: linux
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install Rust toolchain (with musl target for guest rebake)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install runtime deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap curl jq zstd tar musl-tools cpio

      - name: Relax AppArmor unprivileged-userns restriction
        # Mirrors the bwrap job: virtiofsd uses --sandbox namespace which
        # also requires CAP_NET_ADMIN-style perms inside the new userns.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0 || true

      - name: Verify /dev/kvm is available
        run: |
          ls -la /dev/kvm
          sudo chmod 666 /dev/kvm || true

      - name: Fetch VM artifacts (vmlinuz + initrd + rootfs)
        run: scripts/linux/fetch-vm.sh -k vm-kernel-0.2.1 -r vm-rootfs-0.2.1

      - name: Fetch ch runtime binaries (cloud-hypervisor + virtiofsd)
        run: scripts/linux/fetch-ch-deps.sh

      - name: Build guest binaries needed by ch (init/fuse/tun-pump/host-exec)
        run: cargo build --bin tokimo-sandbox-init --bin tokimo-sandbox-fuse --bin tokimo-tun-pump --bin tokimo-host-exec

      - name: Rebake initrd with freshly-built guest binaries
        # The published vm-kernel-* tag bakes guest binaries pinned to that
        # release. When this PR changes guest-side wire-protocol code
        # (tokimo-sandbox-fuse, init, etc.) the baked binaries are stale
        # and ch tests fail with "unknown op" / handshake-style errors.
        # Rebuild guests as musl/release and rebake them into the initrd
        # used by cloud-hypervisor.
        run: bash scripts/linux/rebake-initrd.sh --install-to-vm

      - name: Disk usage before tests
        run: df -h /

      - name: Integration tests (ch)
        env:
          SANDBOX_BACKEND: ch
        run: |
          export PATH="$PWD/target/debug:$PATH"
          cargo test --tests --no-fail-fast -- --test-threads=1

      - name: Disk usage after tests
        if: always()
        run: df -h / && du -sh .vm 2>/dev/null || true

  # ------------------------------------------------------------------
  # macOS: build + test (lib only; VZ needs entitlement signing)
  # ------------------------------------------------------------------
  macos:
    name: macOS (build + test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --lib --bins --tests --examples

      - name: Test
        run: cargo test --lib

  # ------------------------------------------------------------------
  # Windows: build + test (lib + service binary)
  # ------------------------------------------------------------------
  windows:
    name: windows (build + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --lib --bins

      - name: Test
        run: cargo test --lib

  # ------------------------------------------------------------------
  # Lint: fmt + clippy (Linux, where all code paths are active)
  # ------------------------------------------------------------------
  lint:
    name: fmt & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --lib --bins --tests -- -D warnings
