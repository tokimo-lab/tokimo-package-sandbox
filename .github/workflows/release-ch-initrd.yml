name: release-ch-initrd

on:
  push:
    tags:
      - 'initrd-v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Initrd version (e.g., 0.1.0)"
        required: false
        default: "0.1.0"

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            TAG="${GITHUB_REF_NAME}"
            if ! printf "%s" "$TAG" | grep -q "^initrd-v"; then
              echo "Tag must start with initrd-v" >&2
              exit 1
            fi
            VERSION="${TAG#initrd-v}"
          fi

          if [ -z "$VERSION" ]; then
            echo "ERROR: VERSION is empty" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=initrd-v$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch_label: x86_64
            rust_target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch_label: aarch64
            rust_target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Fetch static busybox for runner architecture
        env:
          ARCH_LABEL: ${{ matrix.arch_label }}
        run: |
          scripts/linux/fetch-busybox.sh "target/initrd-deps/${ARCH_LABEL}/busybox"

      - name: Build guest agent and package initrd in Alpine container
        env:
          ARCH_LABEL: ${{ matrix.arch_label }}
          RUST_TARGET: ${{ matrix.rust_target }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          docker run --rm \
            -e ARCH_LABEL \
            -e RUST_TARGET \
            -e VERSION \
            -e GITHUB_SHA \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            rust:1.91-alpine3.21 \
            sh -euxc '
          apk add --no-cache build-base musl-dev linux-headers python3 gzip zstd tar file coreutils
          rustup target add "$RUST_TARGET"

          cargo build --release --bin tokimo-guest-agent --target "$RUST_TARGET"

          AGENT="target/${RUST_TARGET}/release/tokimo-guest-agent"
          BUSYBOX="target/initrd-deps/${ARCH_LABEL}/busybox"
          OUT_DIR="target/ch-initrd-release/${ARCH_LABEL}"
          mkdir -p "$OUT_DIR"
          scripts/linux/build-ch-initrd.sh "$OUT_DIR/initrd.cpio.gz" "$AGENT" "$BUSYBOX"

          SHORT_SHA=$(printf '%s' "$GITHUB_SHA" | cut -c1-12)
          ARCHIVE="tokimo-ch-initrd-${VERSION}-linux-${ARCH_LABEL}.tar.zst"
          ALIAS_ARCHIVE="tokimo-ch-initrd-${ARCH_LABEL}-${SHORT_SHA}.tar.zst"
          tar -I "zstd -19" -cf "$ARCHIVE" -C "$OUT_DIR" initrd.cpio.gz
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          cp "$ARCHIVE" "$ALIAS_ARCHIVE"
          sha256sum "$ALIAS_ARCHIVE" > "${ALIAS_ARCHIVE}.sha256"
          chown -R "$HOST_UID:$HOST_GID" target "$ARCHIVE" "${ARCHIVE}.sha256" "$ALIAS_ARCHIVE" "${ALIAS_ARCHIVE}.sha256"
          '

      - uses: actions/upload-artifact@v4
        with:
          name: ch-initrd-${{ matrix.arch_label }}
          path: |
            tokimo-ch-initrd-${{ needs.meta.outputs.version }}-linux-${{ matrix.arch_label }}.tar.zst
            tokimo-ch-initrd-${{ needs.meta.outputs.version }}-linux-${{ matrix.arch_label }}.tar.zst.sha256
            tokimo-ch-initrd-${{ matrix.arch_label }}-*.tar.zst
            tokimo-ch-initrd-${{ matrix.arch_label }}-*.tar.zst.sha256

  release:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: ch-initrd-x86_64, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: ch-initrd-aarch64, path: dist }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.release_tag }}
          name: ch-initrd ${{ needs.meta.outputs.version }}
          files: |
            dist/tokimo-ch-initrd-*.tar.zst
            dist/tokimo-ch-initrd-*.tar.zst.sha256
