name: virtiofsd

on:
  push:
    tags:
      - 'virtiofsd-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch_label: x86_64
          - runner: ubuntu-24.04-arm
            arch_label: arm64
    steps:
      - name: Build and package virtiofsd in Alpine container
        env:
          ARCH_LABEL: ${{ matrix.arch_label }}
        run: |
          docker run --rm \
            -e ARCH_LABEL \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            rust:1.83-alpine3.21 \
            sh -euxc '
          export PATH=/usr/local/cargo/bin:$PATH
          apk add --no-cache build-base musl-dev linux-headers libcap-ng-dev libcap-ng-static libseccomp-dev libseccomp-static pkgconf git curl zstd tar file gcompat libstdc++
          git clone --branch v1.13.3 --depth 1 https://gitlab.com/virtio-fs/virtiofsd.git ./virtiofsd

          cd virtiofsd
          LIBSECCOMP_LINK_TYPE=static \
            LIBSECCOMP_LIB_PATH=/usr/lib \
            LIBCAPNG_LINK_TYPE=static \
            LIBCAPNG_LIB_PATH=/usr/lib \
            cargo build --release
          cd ..

          BIN="virtiofsd/target/release/virtiofsd"
          strip "$BIN"
          FILE_OUTPUT="$(file "$BIN")"
          echo "$FILE_OUTPUT"
          ls -lh "$BIN"
          set +e
          LDD_OUTPUT="$(ldd "$BIN" 2>&1)"
          LDD_STATUS=$?
          set -e
          echo "$LDD_OUTPUT"
          if printf "%s\n" "$FILE_OUTPUT" | grep -q "dynamically linked"; then
            echo "virtiofsd file output reports a dynamically linked binary" >&2
            exit 1
          fi
          if printf "%s\n" "$LDD_OUTPUT" | grep -q "=>"; then
            echo "virtiofsd ldd output reports dynamic dependencies" >&2
            exit 1
          fi
          if [ "$LDD_STATUS" -ne 0 ]; then
            echo "ldd exited nonzero as expected for a static binary"
          fi

          STAGE="stage-${ARCH_LABEL}"
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/virtiofsd"
          cp virtiofsd/LICENSE-APACHE "$STAGE/LICENSE-APACHE"
          cp virtiofsd/LICENSE-BSD-3-Clause "$STAGE/LICENSE-BSD-3-Clause"
          tar -I "zstd -19" -cf "tokimo-virtiofsd-${ARCH_LABEL}.tar.zst" -C "$STAGE" virtiofsd LICENSE-APACHE LICENSE-BSD-3-Clause
          sha256sum "tokimo-virtiofsd-${ARCH_LABEL}.tar.zst" > "tokimo-virtiofsd-${ARCH_LABEL}.tar.zst.sha256"
          chown -R "$HOST_UID:$HOST_GID" virtiofsd "$STAGE" "tokimo-virtiofsd-${ARCH_LABEL}.tar.zst" "tokimo-virtiofsd-${ARCH_LABEL}.tar.zst.sha256"
          '

      - uses: actions/upload-artifact@v4
        with:
          name: virtiofsd-${{ matrix.arch_label }}
          path: |
            tokimo-virtiofsd-${{ matrix.arch_label }}.tar.zst
            tokimo-virtiofsd-${{ matrix.arch_label }}.tar.zst.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: virtiofsd-x86_64, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: virtiofsd-arm64, path: dist }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tokimo-virtiofsd-x86_64.tar.zst
            dist/tokimo-virtiofsd-x86_64.tar.zst.sha256
            dist/tokimo-virtiofsd-arm64.tar.zst
            dist/tokimo-virtiofsd-arm64.tar.zst.sha256
