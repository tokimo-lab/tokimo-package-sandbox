name: vm

# Single workflow that builds the user-facing VM image (kernel + initrd
# + rootfs) end-to-end.
#
# This collapses the previous two-stage `vm-base.yml` + `vm-image.yml`
# split. The split existed to make rebuilding the init binary cheap by
# reusing a cached debootstrap, but in practice debootstrap takes only
# ~5 min per arch and the cross-workflow tag namespace
# (`vm-base-v*` ↔ `vm-*`) was a constant source of confusion. Build it
# all in one pipeline and pay the few extra minutes.
#
# Trigger:
#   * push tag vm-kernel-*         → publish kernel + initrd (tokimo guest
#                                    binaries baked in) at that tag
#   * push tag vm-rootfs-*         → publish Debian rootfs (tarball + vhdx,
#                                    NO tokimo binaries inside) at that tag
#   * workflow_dispatch            → optional release_tag for manual cuts
#
# The two tag namespaces decouple host-crate version churn (which only
# touches the initrd, via vm-kernel-*) from rare Debian/kernel rebuilds
# (vm-rootfs-*). Old `vm-*` tags are retired and not produced.
#
# Output (per arch), depending on tag prefix:
#   vm-kernel-* publishes:
#     tokimo-linux-kernel-{x86_64,arm64}.tar.zst
#       vmlinuz + initrd.img (init/fuse/tun-pump baked into initrd /bin/)
#   vm-rootfs-* publishes:
#     tokimo-linux-rootfs-{x86_64,arm64}.tar.zst   (Debian, no tokimo bins)
#     tokimo-linux-rootfs-x86_64.vhdx.zip          (Windows HCS, amd64 only)

on:
  push:
    tags:
      - 'vm-kernel-*'
      - 'vm-rootfs-*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish (vm-kernel-* or vm-rootfs-*). Leave empty for dry run."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            suffix: x86_64
            rust_target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
            rust_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: vm-${{ github.ref }}-${{ matrix.arch }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install build deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools zstd cpio gzip qemu-utils zip

      - name: Build guest binaries (init + tun-pump + fuse) musl static
        run: |
          cargo build --release --target ${{ matrix.rust_target }} \
            --bin tokimo-sandbox-init \
            --bin tokimo-tun-pump \
            --bin tokimo-sandbox-fuse

      - name: Build base VM image (debootstrap + kernel + initrd) with init/tun-pump/fuse baked in
        working-directory: packaging/vm-base
        env:
          TOKIMO_INIT_BIN: ${{ github.workspace }}/target/${{ matrix.rust_target }}/release/tokimo-sandbox-init
          TOKIMO_TUN_PUMP_BIN: ${{ github.workspace }}/target/${{ matrix.rust_target }}/release/tokimo-tun-pump
          TOKIMO_FUSE_BIN: ${{ github.workspace }}/target/${{ matrix.rust_target }}/release/tokimo-sandbox-fuse
        run: bash build.sh ${{ matrix.arch }}

      - name: Package rootfs tarball
        run: |
          SFX=${{ matrix.suffix }}
          tar -cpf "tokimo-linux-rootfs-${SFX}.tar" -C "packaging/vm-base/tokimo-os-${{ matrix.arch }}/rootfs" .
          zstd -10 -T0 "tokimo-linux-rootfs-${SFX}.tar" -o "tokimo-linux-rootfs-${SFX}.tar.zst"
          sha256sum "tokimo-linux-rootfs-${SFX}.tar.zst" > "tokimo-linux-rootfs-${SFX}.tar.zst.sha256"
          rm "tokimo-linux-rootfs-${SFX}.tar"

      - name: Package kernel + initrd bundle
        run: |
          SFX=${{ matrix.suffix }}
          tar -cpf "tokimo-linux-kernel-${SFX}.tar" -C "packaging/vm-base/tokimo-os-${{ matrix.arch }}" vmlinuz initrd.img
          zstd -10 -T0 "tokimo-linux-kernel-${SFX}.tar" -o "tokimo-linux-kernel-${SFX}.tar.zst"
          sha256sum "tokimo-linux-kernel-${SFX}.tar.zst" > "tokimo-linux-kernel-${SFX}.tar.zst.sha256"
          rm "tokimo-linux-kernel-${SFX}.tar"

      - name: Package rootfs as VHDX (amd64 only)
        if: matrix.arch == 'amd64'
        run: |
          SFX=${{ matrix.suffix }}
          ROOTFS_DIR=packaging/vm-base/tokimo-os-${{ matrix.arch }}/rootfs
          ROOTFS_SIZE=$(sudo du -sm "$ROOTFS_DIR" | cut -f1)
          IMG_SIZE=$((ROOTFS_SIZE + 512))
          qemu-img create -f raw rootfs.img ${IMG_SIZE}M
          mkfs.ext4 -F rootfs.img
          mkdir -p /tmp/rootfs-mnt
          sudo mount -o loop rootfs.img /tmp/rootfs-mnt
          sudo cp -a "$ROOTFS_DIR"/. /tmp/rootfs-mnt/
          sudo umount /tmp/rootfs-mnt
          qemu-img convert -f raw -O vhdx -o subformat=dynamic rootfs.img rootfs.vhdx
          zip -9 "tokimo-linux-rootfs-${SFX}.vhdx.zip" rootfs.vhdx
          sha256sum "tokimo-linux-rootfs-${SFX}.vhdx.zip" > "tokimo-linux-rootfs-${SFX}.vhdx.zip.sha256"
          rm rootfs.img rootfs.vhdx

      - uses: actions/upload-artifact@v4
        with:
          name: vm-${{ matrix.suffix }}
          path: |
            tokimo-linux-rootfs-${{ matrix.suffix }}.tar.zst*
            tokimo-linux-kernel-${{ matrix.suffix }}.tar.zst*
            tokimo-linux-rootfs-${{ matrix.suffix }}.vhdx.zip*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    steps:
      - uses: actions/download-artifact@v4
        with: { name: vm-x86_64, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: vm-arm64,  path: dist }

      - name: Resolve tag and select artifact set
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ inputs.release_tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            vm-kernel-*)
              echo "kind=kernel" >> "$GITHUB_OUTPUT"
              {
                echo 'files<<EOF'
                echo 'dist/tokimo-linux-kernel-*.tar.zst*'
                echo EOF
              } >> "$GITHUB_OUTPUT"
              ;;
            vm-rootfs-*)
              echo "kind=rootfs" >> "$GITHUB_OUTPUT"
              {
                echo 'files<<EOF'
                echo 'dist/tokimo-linux-rootfs-*.tar.zst*'
                echo 'dist/tokimo-linux-rootfs-*.vhdx.zip*'
                echo EOF
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "tag '$TAG' does not match vm-kernel-* or vm-rootfs-*" >&2
              exit 1
              ;;
          esac

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          make_latest: true
          body: |
            ${{ steps.meta.outputs.kind == 'kernel' && 'Kernel + initrd (tokimo guest binaries baked in) for tokimo-package-sandbox.' || 'Debian rootfs (tarball + vhdx, no tokimo binaries) for tokimo-package-sandbox.' }}

            See `scripts/windows/fetch-vm.ps1` / `scripts/linux/fetch-vm.sh` for download usage. The `vm-kernel-*` and `vm-rootfs-*` tags are independent — pull them as a pair (latest of each) into `.vm/base/`.
          files: ${{ steps.meta.outputs.files }}
