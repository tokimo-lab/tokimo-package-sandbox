[package]
name = "tokimo-package-sandbox"
version = "0.1.0"
edition = "2024"
authors = ["William Chan <root@williamchan.me>"]
license = "MIT"
description = "Cross-platform native sandbox for running arbitrary commands safely. Linux (bwrap + seccomp), macOS (Apple Virtualization.framework + FUSE-over-vsock), Windows (Hyper-V HCS)."
repository = "https://github.com/tokimo-lab/tokimo-package-sandbox"
homepage = "https://github.com/tokimo-lab/tokimo-package-sandbox"
documentation = "https://docs.rs/tokimo-package-sandbox"
readme = "README.md"
keywords = ["sandbox", "security", "isolation", "seccomp", "seatbelt"]
categories = ["os"]

[features]
default = []
# Opt-in eBPF L4 observer backend (currently scaffold only — see src/linux/l4/ebpf.rs).
ebpf = []

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
tempfile = "3.10"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# VFS bridge (host ↔ guest FUSE-over-vsock). Cross-platform: trait + protocol
# live in src/vfs_backend.rs, src/vfs_protocol/, src/vfs_host/. See
# plan/cross-platform-fuse-vfs.md.
async-trait = "0.1"
postcard = { version = "1", features = ["use-std"] }
slab = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "io-util", "macros", "fs", "net", "process"] }
# Host-side filesystem watcher: inotify on Linux, FSEvents on macOS,
# ReadDirectoryChangesW on Windows. Used to translate external mutations
# of a LocalDirVfs root into FUSE_NOTIFY_INVAL_ENTRY / INVAL_INODE so
# guest kernel caches never go stale within our 60s entry TTL.
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["process", "signal", "socket", "fs", "event", "ioctl", "term", "uio", "poll"] }
libc = "0.2"
mio = { version = "1", features = ["os-poll", "net", "os-ext"] }
# Userspace network stack — same as Windows/macOS. See src/netstack/.
smoltcp = { version = "0.13", default-features = false, features = [
    "std", "medium-ethernet", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp",
    "socket-tcp-pause-synack",
] }
crossbeam-channel = "0.5"
# FUSE bridge (guest-side). Used only by the tokimo-sandbox-fuse binary
# inside the VM/bwrap. abi-7-31 keeps the kernel ABI requirement
# compatible with the Debian bookworm kernel shipped in the initrd.
fuser = { version = "0.15", default-features = false, features = ["abi-7-31"] }
tokio-vsock = "0.7"
xattr = "1"

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.29", features = ["process", "signal", "socket", "poll", "uio", "fs", "event", "ioctl", "term"] }
libc = "0.2"
arcbox-vz = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "io-util", "macros"] }
async-trait = "0.1"
mio = { version = "1", features = ["os-poll", "os-ext"] }
# Userspace network stack — same as Windows. See src/netstack/.
smoltcp = { version = "0.13", default-features = false, features = [
    "std", "medium-ethernet", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp",
    "socket-tcp-pause-synack",
] }
crossbeam-channel = "0.5"
xattr = "1"

[target.'cfg(target_os = "windows")'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "io-util", "macros"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Wdk_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
] }
windows-service = "0.8"
# Userspace network stack (replaces HCN NAT for NetworkPolicy::AllowAll).
# See plan/cowork-networking-reverse-engineering.md and
# docs/network-allow-all-failure-investigation.md for the rationale.
smoltcp = { version = "0.13", default-features = false, features = [
    "std", "medium-ethernet", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp",
    "socket-tcp-pause-synack",
] }
crossbeam-channel = "0.5"
mio = { version = "1", features = ["os-poll", "net", "os-ext"] }

[[bin]]
name = "tokimo-tun-pump"
path = "src/bin/tokimo-tun-pump/main.rs"

[[bin]]
name = "tokimo-sandbox-fuse"
path = "src/bin/tokimo-sandbox-fuse/main.rs"

[[bin]]
name = "tokimo-host-exec"
path = "src/bin/tokimo-host-exec/main.rs"

[[bench]]
name = "vfs_wire"
harness = false

[[bench]]
name = "vfs_e2e"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
reqwest = { version = "0.12", features = ["blocking"] }
tracing-subscriber = "0.3"
# Used by tests/k6_perf_diag.rs::k6_real_regression to fetch + unpack the
# k6 release tarball into a host-mounted workspace so the in-sandbox VM
# can execute it. amd64 linux static binary, ~25 MB compressed.
flate2 = "1"
tar = "0.4"
smoltcp = { version = "0.13", default-features = false, features = [
    "std", "medium-ethernet", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp",
    "socket-tcp-pause-synack",
] }
crossbeam-channel = "0.5"
